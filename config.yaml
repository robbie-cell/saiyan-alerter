# runtime config for the SAIYAN OCC (XXX) Python port → Telegram alerter
# Default exchange: `gate` (Gate.io). Binance geo-blocks GitHub Actions runner
# IPs with HTTP 451 ("restricted location"), so the cron deployment cannot read
# Binance candles; Gate.io has no such block and lists all pairs below
# (incl. PAXG/USDT). To run locally against Binance instead, set `exchange: binance`
# — the cron copy of this file must keep `gate` to work.
exchange: gate

# Pairs accept either a plain 'BASE/QUOTE' string (uses the default exchange)
# or a dict with optional `exchange:` dict fields (cross-exchange setups,
# custom timeframes/indicators — reserved for future work).
# Note on `XAU/USD`: Bitfinex and MEXC both raise `BadSymbol` on XAU/USD via
# ccxt's public OHLCV endpoint (commodity-bearing exchanges generally don't
# carry a native XAU/USD spot symbol through that route). `PAXG/USDT`
# (Paxos Gold — 1 troy oz per token, tracks XAU/USD within ~0.10%) is the
# working substitute and uses the same ccxt exchange as the crypto pairs above.
#   pairs:
#     - BTC/USDT
#     - PAXG/USDT                                  # gold proxy
#     - {symbol: XAU/USDT, exchange: mexc}         # if mexc ever exposes XAU/USDT via ccxt
# The dict form supports as many `symbol`/`exchange` overrides as needed.
# Portfolio: trimmed to the 3 best markets from the 90-day backtest ranking
# (rank_markets.py) — the top-3 beat all-7 on a single $600 account at
# budget-matched sizes (+202% vs +164% in compare_portfolios.py) with ~57%
# fewer Telegram messages. Order = ranking (best first).
#
# To add a pair back, just append it here — the bot picks it up on the next
# run. PAXG/USDT (gold proxy) was #4, effectively tied with BTC on the
# composite score and adds non-crypto diversification; SOL/USDT was the worst
# (lowest win rate, lowest profit factor, highest drawdown).
pairs:
  - ETH/USDT   # rank #1 — best all-round (best avg R + return)
  - XRP/USDT   # rank #2 — near-identical profile to ETH
  - BTC/USDT   # rank #3 — best reliability (win rate / profit factor)

indicator:
  ma_type: ALMA
  basis_len: 2
  offset_sigma: 5          # sigma for ALMA; offset for LSMA
  offset_alma: 0.85
  use_res: true
  intres_multiplier: 8     # HTF = chart_timeframe_min * intres_multiplier  (15m * 8 = 2h)
  chart_timeframe_min: 15  # 15-minute candles on the LTF
  delay_offset: 0
  heikin_ashi: false
  tp_levels_pct: [1.0, 1.5, 2.0]   # (unused when exits.mode = atr — kept for fixed mode)
  sl_level_pct: 0.5                # (unused when exits.mode = atr)
  trade_type: BOTH         # LONG / SHORT / BOTH / NONE

  # Exit engineering — researched in research_exits.py (iteration 1).
  # ATR-scaled stops/targets + a breakeven trail beat fixed percentages on
  # BOTH the Gate 90d window (PF 4.83 vs 4.32, +98.5% vs +77.6%, maxDD 2.24%
  # vs 2.46%) and the out-of-sample Binance 6mo window (PF 4.17 vs 3.23,
  # +209.5% vs +146.2%, win 71.4% vs 62.1%). Wider (2.25/2.5) and tighter
  # (1.0/1.5) multiples tested worse on risk-adjusted terms; the 2.0/4-6-8
  # point is the plateau. PAXG (not live) degrades under ATR exits — re-check
  # before ever re-adding gold.
  exits:
    mode: atr               # fixed | atr | atr_trail
    atr_len: 14             # SMA of true range (bars)
    sl_atr_mult: 2.25       # stop = 2.25 * ATR below/above entry
    tp_atr_mults: [5.0, 7.5, 10.0]  # TP1/2/3 in ATR multiples
    # Fraction banked at each TP. Sensitivity research (research_sizing.py +
    # research_sensitivity.py + research_final.py) converged on holding MORE
    # for the outer targets: (0.15, 0.25, 0.6) beat flat thirds on both
    # windows (+120.4%/+256.5% vs +98.5%/+209.5%, PF 6.52/5.30 vs 4.83/4.17).
    tp_fractions: [0.15, 0.25, 0.6]
    breakeven_after_tp1: false  # researched: BE cut PF (4.95->6.34 on the 90d
                                # window) by stopping out runners early — with
                                # a 2.25 ATR stop the protection is redundant

# ---------------------------------------------------------------------------
# Institutional filter stack (filters.py) — the confluence layer on top of the
# raw indicator signal.
#
# The ONLY hard gate that earned its place in the 95-day fee-adjusted A/B
# (research.py, all 7 pairs, parity-checked against the original backtest):
#
#   HARD: 4h EMA(30) trend alignment — entries are BLOCKED unless they trade
#         WITH the higher-timeframe trend (Long only while 4h close > its
#         EMA30, Short only below). This is the whole institutional edge:
#         net edge/trade +64% (0.30% -> 0.49%), profit factor 3.06 -> 5.63,
#         max drawdown 4.84% -> 2.11%, win rate 63% -> 72% (90d, net of fees
#         + slippage). It costs signal volume (~85-90% blocked) — that is the
#         point: only with-trend signals fire, ~1-2/day across 3 pairs.
#
#   SOFT (grade-only, never block): volatility regime (LOW/MID/HIGH ATR
#   percentile) and entry-bar momentum contribute to the Confidence: x/5 line
#   on each alert. Research showed BLOCKING on them HURTS the edge (they remove
#   good entries), so they are informational only.
#
# Settings that research REJECTED (kept here as documentation, all off):
#   * block_vol_low/high   — removing dead/chaotic vol removed good trades
#   * hard_momentum        — impulse gating cut win rate to 51%
#   * cooldown_sl_bars     — no edge gain, just fewer trades
#   * session_utc          — session gating made every metric worse
# Full numbers in research_report.json / research_htf_report.json.
# ---------------------------------------------------------------------------
filters:
  enabled: true
  # Hard trend gate (the edge).
  htf_minutes: 240          # 4h bars (resampled from the 15m feed)
  htf_ema_len: 30           # EMA(30) on 4h closes (~5 days of context)
  hard_htf: true            # misaligned entries are BLOCKED
  # Soft confidence inputs (never block).
  ltf_ema_len: 0            # 15m EMA trend — 0 = off
  vol_window: 960           # 10 days at 15m for the ATR percentile bands
  vol_low_pct: 10.0
  vol_high_pct: 90.0
  block_vol_low: false      # research: blocking dead vol removed good trades
  block_vol_high: false
  momentum: impulse         # close-in-direction soft credit for confidence
  hard_momentum: false
  cooldown_sl_bars: 0       # research: no edge gain
  cooldown_tp_bars: 0
  session_utc: null         # null = 24/7 (session gating made metrics worse)

# dedupe ignores repeat (symbol, kind) signals within this many minutes
dedupe_minutes: 5

# Telegram quiet hours (null OR [start_hour, end_hour] in 24h local time).
# Set to null to send 24/7.
quiet_hours: null

# Time zone used for quiet-hours comparison and Telegram event timestamps.
# IANA name; e.g. Australia/Melbourne (AEST in winter, AEDT in summer).
timezone: Australia/Melbourne

