# SAIYAN alerter — scheduled signal scan (GitHub Actions cron)
#
# Runs `main.py check` every 5 minutes. Each run fetches trailing candles,
# recomputes the indicator, and sends only events on bars closed since the last
# run (per-pair progress is carried between runs via the `saiyan-state` artifact).
#
# Cadence: this repo is PUBLIC, so Actions minutes are unlimited and a 5-minute
# schedule is free. Runs are offset 1 minute past each 5-minute boundary
# (:01, :06, :11, …) so a 15m candle closing at :00/:15/:30/:45 UTC is picked up
# ~1-6 minutes after it closes (GitHub schedules can lag a few minutes). Because
# `check` processes EVERY candle closed since the last run, a delayed or skipped
# run never loses a signal — it simply catches up on the next run.
#
# (If this repo is ever made PRIVATE again: the free tier caps private repos at
# 2,000 Actions minutes/month and rounds each job up to a whole minute, so the
# cadence must go back to 30 minutes — "5,35 * * * *" — or jobs silently stop.)

name: SAIYAN alerter check

on:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"   # every 5 min, :01 offset, UTC
  workflow_dispatch: {}      # allow manual runs (use for the first baseline)

# Serialize runs: a queued run waits for the one in flight, so two runs can
# never read the same state and double-send.
concurrency:
  group: saiyan-check
  cancel-in-progress: false

permissions:
  actions: read    # list previous runs + download their state artifact
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The bot needs the previous run's state file (which bars it already
      # reported per pair). The previous run must be SUCCESSFUL, since a
      # successful run always uploads the state artifact. The very first run
      # has no predecessor — the download step is skipped and the bot baselines
      # on the most recent closed bar without replaying old signals.
      - name: Find previous successful run
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download previous state
        if: steps.prev.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: saiyan-state
          path: state
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # no artifact yet (first run) is fine

      - name: Scan closed candles and send new signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Exit 1 (job goes red) if any pair failed — the next scheduled run
        # retries those pairs. State for successful pairs is already advanced,
        # so nothing is re-sent.
        run: python main.py check --state state/saiyan_state.json

      - name: Upload state for the next run
        uses: actions/upload-artifact@v4
        with:
          name: saiyan-state
          path: state/saiyan_state.json
          if-no-files-found: error
