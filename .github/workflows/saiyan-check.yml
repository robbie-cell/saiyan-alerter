# SAIYAN alerter — scheduled signal scan (GitHub Actions cron)
#
# Runs `main.py check` every 5 minutes. Each run fetches trailing candles,
# recomputes the (filter-gated) indicator, and sends only events on bars closed
# since the last run (per-pair progress is carried between runs via the
# `saiyan-state` artifact).
#
# Institutional filter stack: config.yaml `filters:` enables the 4h EMA30 hard
# trend gate — raw entries that fight the higher timeframe are blocked, so only
# with-trend signals fire (~1-2/day). Blocked signals are counted per run and
# surfaced in the daily recap's "🔇 filtered" line.
#
# Live track record: each run also appends newly-closed trades to
# `saiyan_ledger.json` (keyed by symbol+entry_time, idempotent), which rides the
# same artifact and feeds the daily recap's "📈 Track record" line — a measured,
# cumulative win rate / avg R / net % on real closes.
#
# Cadence: this repo is PUBLIC, so Actions minutes are unlimited and a 5-minute
# schedule is free. Runs are offset 1 minute past each 5-minute boundary
# (:01, :06, :11, …) so a 15m candle closing at :00/:15/:30/:45 UTC is picked up
# ~1-6 minutes after it closes (GitHub schedules can lag a few minutes). Because
# `check` processes EVERY candle closed since the last run, a delayed or skipped
# run never loses a signal — it simply catches up on the next run.
#
# (If this repo is ever made PRIVATE again: the free tier caps private repos at
# 2,000 Actions minutes/month and rounds each job up to a whole minute, so the
# cadence must go back to 30 minutes — "5,35 * * * *" — or jobs silently stop.)
#
# NOTE (2026-08-10): GitHub does not always activate a `schedule` trigger on a
# brand-new repo until a fresh push to the default branch re-evaluates it. If
# scheduled runs stop appearing in the Actions tab, push any trivial change to
# `main` to re-arm the schedule.

name: SAIYAN alerter check

on:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"   # every 5 min, :01 offset, UTC
  workflow_dispatch: {}      # allow manual runs (use for the first baseline)

# Serialize runs: a queued run waits for the one in flight, so two runs can
# never read the same state and double-send.
concurrency:
  group: saiyan-check
  cancel-in-progress: false

permissions:
  actions: read    # list previous runs + download their state artifact
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The bot needs the previous run's state file (which bars it already
      # reported per pair) and its signal ledger. The very first run has no
      # predecessor — the download step is skipped and the bot baselines on the
      # most recent closed bar without replaying old signals.
      - name: Find previous successful run
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        # IMPORTANT: filter to THIS workflow (saiyan-check.yml). Without the
        # workflow= filter, the most recent successful run can be the daily
        # recap (saiyan-daily.yml), which uploads no state artifact — the
        # download would fail and the bot would re-baseline (losing dedupe
        # continuity and re-sending the startup message).
        run: |
          # NOTE: do NOT use the raw `actions/runs?workflow=...&status=success`
          # API here -- GitHub ignores the workflow= filter when status is also
          # set (returns the latest successful run of ANY workflow, e.g. the
          # daily recap, which uploads no state artifact). `gh run list`
          # applies both filters correctly.
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow saiyan-check.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download previous state
        if: steps.prev.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: saiyan-state
          path: state
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # no artifact yet (first run) is fine

      # Hard guard: if a previous successful run EXISTS but its state did not
      # download (artifact expiry, API glitch...), fail fast BEFORE scanning.
      # Without this, main.py treats the missing state as a first run every
      # time — re-baselining (losing dedupe continuity) and re-sending the
      # startup + cloud-paper-trader Telegram messages on every run.
      - name: Verify previous state downloaded
        if: steps.prev.outputs.run_id != ''
        run: |
          if [ ! -f state/saiyan_state.json ]; then
            echo "Previous successful run ${{ steps.prev.outputs.run_id }} had no downloadable state — aborting to avoid re-baselining and Telegram spam."
            exit 1
          fi

      - name: Scan closed candles and send new signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Exit 1 (job goes red) if any pair failed — the next scheduled run
        # retries those pairs. State for successful pairs is already advanced,
        # so nothing is re-sent.
        # Execution: config.yaml execution.mode is `paper` by default, so each
        # run also feeds the new closed-bar events to the paper executor
        # (--exec-state state/saiyan_exec_state.json). Its state — open
        # positions, daily PnL, halt flag, command offset — rides the same
        # artifact, giving a 24/7 cloud paper-trader with the Telegram admin
        # command suite (/status /recap /balance /stop /resume /flat /help).
        # For testnet/live, mode: testnet|live + the two GATE_* secrets (never
        # in the repo) — see deploy/gh-actions/README.md.
        run: python main.py check --state state/saiyan_state.json --ledger state/saiyan_ledger.json --exec-state state/saiyan_exec_state.json

      # TEMPORARY (one run): reset the paper-trader account. The exec-state
      # was frozen on a stale phantom XRP short (opened Aug 18, never closed)
      # from before the look-ahead fix. Deleting it here makes the NEXT run
      # start a fresh paper account with no positions. Removed immediately
      # after the reset run lands.
      - name: Reset paper-trader account (temporary)
        run: |
          rm -f state/saiyan_exec_state.json
          echo "Paper-trader account reset for clean forward record"

      - name: Upload state + ledger for the next run
        uses: actions/upload-artifact@v4
        with:
          name: saiyan-state
          path: state/          # saiyan_state.json + saiyan_ledger.json + saiyan_exec_state.json
          if-no-files-found: error
