# SAIYAN daily recap — one Telegram summary per day
#
# Runs `python main.py daily` which recomputes the last 24h from candles and
# sends a single digestible recap: per-pair signals, closed-trade win rate and
# net %, open positions with unrealized PnL, how many raw signals the 4h trend
# gate filtered ("🔇"), and the cumulative measured track record from the
# signal ledger ("📈" — win rate / avg R / net % on real closes since the
# ledger started). Also doubles as a daily liveness check — if you stop getting
# these, the bot is down.
#
# The ledger is downloaded from the latest successful saiyan-check run
# (same artifact name, so the first day or two before it exists is fine —
# the download is continue-on-error and the recap simply omits that line).
#
# Time: 23:59 Melbourne (AEST = UTC+10) → 13:59 UTC. To change the hour, edit
# the cron below (GitHub schedules are UTC): convert your local hour to UTC.
# NOTE (DST): when Melbourne switches to AEDT (UTC+11, Oct→Apr) this fires at
# 00:59 local; set the cron to "59 12 * * *" during that window to keep 23:59.

name: SAIYAN daily recap

on:
  schedule:
    - cron: "59 13 * * *"   # 23:59 Melbourne (AEST) = 13:59 UTC
  workflow_dispatch: {}    # allow manual runs (e.g. to test)

permissions:
  actions: read    # find + download the check workflow's state/ledger artifact
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find latest successful check run
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # NOTE: do NOT use the raw `actions/runs?workflow=...&status=success`
          # API here -- GitHub ignores the workflow= filter when status is also
          # set (returns the latest successful run of ANY workflow, e.g. the
          # daily recap, which uploads no state artifact). `gh run list`
          # applies both filters correctly.
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow saiyan-check.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download signal ledger
        if: steps.prev.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: saiyan-state
          path: state
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # no ledger yet (first day) is fine

      - name: Send daily recap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py daily --hours 24 --ledger state/saiyan_ledger.json
