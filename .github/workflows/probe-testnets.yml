name: probe-testnets
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OKX demo + gate correct paths
        run: |
          probe() {
            echo "== $1 =="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "$2" || echo "curl failed (exit $?)"
          }
          probe "okx demo public time (x-sim header not needed for public)" "https://www.okx.com/api/v5/public/time"
          probe "gate testnet spot tickers" "https://api-testnet.gateapi.io/api/v4/spot/tickers"
          probe "gate testnet currency pairs" "https://api-testnet.gateapi.io/api/v4/spot/currency_pairs"
          probe "okx spot tickers" "https://www.okx.com/api/v5/market/tickers?instType=SPOT"
