name: probe-testnets
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public endpoints from runner IP
        run: |
          echo "== runner IP =="
          curl -s --max-time 15 https://api.ipify.org; echo
          echo "== kucoin sandbox =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://api-sandbox.kucoin.com/api/v1/timestamp"
          echo "== bitget testnet =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://api-testnet.bitget.com/api/v2/public/time"
          echo "== gate testnet =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://api-testnet.gateapi.io/api/v4/time"
          echo "== okx testnet =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://www.okx.com/api/v5/public/time"
          echo "== mexc demo =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://contract.mexc.com/api/v1/contract/time"
          echo "== bybit demo (api-demo) =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://api-demo.bybit.com/v5/market/time"
