name: probe-testnets
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public endpoints from runner IP
        run: |
          echo "== runner IP =="
          curl -s --max-time 15 https://api.ipify.org; echo
          echo "== bybit testnet public =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://api-testnet.bybit.com/v5/market/time"
          echo "== binance testnet public (ping) =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://testnet.binance.vision/api/v3/ping"
          echo "== binance testnet public (exchangeInfo) =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 "https://testnet.binance.vision/api/v3/exchangeInfo"
